events {
    worker_connections 2048;
}

http {
    upstream seatsurge_backend {
        server app1:3001 max_fails=2 fail_timeout=3s;
        server app2:3002 max_fails=2 fail_timeout=3s;
    }

    server {
        listen 80;

        proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
        proxy_connect_timeout 1s;

        location /ws {
            proxy_pass http://seatsurge_backend/ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
        }

        location /api/ {
            proxy_pass http://seatsurge_backend/api/;
            proxy_http_version 1.1;
            proxy_set_header Idempotency-Key $http_idempotency_key;
        }

        location /health {
            proxy_pass http://seatsurge_backend/health;
        }
    }
}
