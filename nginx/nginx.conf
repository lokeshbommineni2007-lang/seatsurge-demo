pid /tmp/seatsurge_nginx.pid;
error_log /tmp/seatsurge_nginx_error.log;

events {
    worker_connections 2048;
}

http {
    access_log /tmp/seatsurge_nginx_access.log;
    include /opt/homebrew/etc/nginx/mime.types;
    default_type application/octet-stream;

    upstream seatsurge_backend {
        server 127.0.0.1:3001 max_fails=2 fail_timeout=3s;
        server 127.0.0.1:3002 max_fails=2 fail_timeout=3s;
    }

    server {
        listen 8080;
        server_name localhost;

        proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
        proxy_connect_timeout 1s;

        location /ws {
            proxy_pass http://seatsurge_backend/ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/ {
            proxy_pass http://seatsurge_backend/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Idempotency-Key $http_idempotency_key;
        }

        location /health {
            proxy_pass http://seatsurge_backend/health;
        }

        location / {
            proxy_pass http://127.0.0.1:5173/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
        }
    }
}
